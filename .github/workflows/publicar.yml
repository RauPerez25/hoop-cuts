name: Publicar instalador
# Publica dist/Instalar-Hoop-Cuts.exe como «release» vX.Y.Z (instalador/version_instalador.txt).
# El .exe se construye con instalador/construir.sh (necesita NSIS) y se sube a dist/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [dist/**, instalador/version_instalador.txt]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat instalador/version_instalador.txt)
          sha256sum dist/Instalar-Hoop-Cuts.exe
          if gh release view "v$VER" > /dev/null 2>&1; then
            gh release upload "v$VER" dist/Instalar-Hoop-Cuts.exe --clobber
          else
            gh release create "v$VER" dist/Instalar-Hoop-Cuts.exe --title "Hoop Cuts $VER" \
              --notes "Instalador de Hoop Cuts para Windows. Necesitas una clave de licencia."
          fi
